# 인스타그램 게시
# - main 브랜치의 queue/ 에 새 게시물이 들어오면 자동 실행 → 게시 → published/ 로 이동
# - 승인 방식: Claude가 "post/이름" 브랜치로 PR을 연다 → 운영자가 이미지 확인 후 Merge = 게시 승인
# - 수동 실행(Actions 탭 → Run workflow):
#     check   : 토큰·계정만 확인 (게시 안 함)
#     publish : queue/ 의 게시물(또는 지정한 이름) 게시
name: Instagram 게시

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 토큰 확인만 / publish = 게시"
        type: choice
        options: [check, publish]
        default: check
      slug:
        description: "게시할 이름 (예: 2026-11-01-환율). 비우면 queue 전체"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: 토큰·계정 확인
        run: python scripts/instagram.py check

      - name: 게시
        if: github.event_name == 'push' || inputs.mode == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: bash scripts/publish_queue.sh "$SLUG"
